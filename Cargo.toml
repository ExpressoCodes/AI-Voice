[package]
name = "voicechat"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voicechat"
path = "src/main.rs"

[dependencies]
# GUI
gtk4       = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib       = "0.20"
cairo-rs   = "0.20"

# Async
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
async-channel = "2"
futures       = "0.3"

# Audio
cpal   = "0.15"
hound  = "3"
rubato = "0.15"

# STT
whisper-rs = "0.14"


# HTTP client (used for model downloads; also available to optional HTTP backends)
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
async-stream = "0.3"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# Errors / logging
anyhow             = "1"
thiserror          = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dirs       = "5"
tokio-util = { version = "0.7", features = ["io"] }
bytes      = "1"
once_cell  = "1"
sha2       = "0.10"
hex        = "0.4"
kokorox = "0.1.5"
ndarray = "0.16"
ort = { version = "2.0.0-rc.10", default-features = true }


[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

[patch.crates-io]
# Patched to fix ort 2.0.0-rc.13 API incompatibilities:
#   - CPUExecutionProvider renamed to ort::ep::CPU
#   - session.inputs / .outputs became methods
kokorox = { path = "vendor/kokorox" }
